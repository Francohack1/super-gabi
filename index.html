<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8442f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Super Gabi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    .toast[hidden]{display:none}
/* VOICE: práctica y cálida, para usar con una mano en el pasillo
   IDEA: la nota de la compra pegada en la nevera, ordenada por pasillos
   PICTURE: la lista misma, arriba de todo, agrupada por sección del súper
   COLOUR and TYPE: blanco, tinta, rojo tomate de acento, amarillo nota; Archivo 800 + Inter
   LAYOUT: una columna de 640px, barra para agregar fija abajo */
:root{color-scheme:light dark;--bg:light-dark(#fbfaf7,#121212);--card:light-dark(#ffffff,#1c1c1c);--ink:light-dark(#1a1a1a,#f2f0ea);--mute:light-dark(#6b6b6b,#a3a19a);--line:light-dark(#e8e5dd,#2e2e2e);--acc:#e8442f;--acci:#ffffff;--note:light-dark(#fff2c2,#3a3115);--noteb:light-dark(#f0d56a,#6b5a20);--mb:light-dark(#e3f1e7,#1d3325);--mi:light-dark(#1d6b3a,#8fd3a5);--lb:light-dark(#e4ebfb,#1c2640);--li:light-dark(#1f47b3,#a3baf5)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:150px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{background:var(--acc);color:var(--acci)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:14px}
h1{font:800 32px/1.05 Archivo,sans-serif;margin:0;letter-spacing:-.01em}
.st{font-size:13px;display:flex;align-items:center;gap:6px;opacity:.95;text-align:right}
.st i{width:8px;height:8px;border-radius:50%;background:#ffd75e;flex:none}
.st.ok i{background:#9ef0b5}.st.off i{background:#fff}
nav{background:var(--acc);padding-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px;max-width:640px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;border:0;border-radius:20px;padding:0 14px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;font-size:15px;white-space:nowrap}
.chip[aria-current=true]{background:#fff;color:var(--acc)}
.chip b{font-weight:500;opacity:.75;margin-left:6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 4px;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;min-height:36px;padding:0 12px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.prog{font-size:14px;color:var(--mute);white-space:nowrap}
.prog strong{color:var(--ink);font:800 20px Archivo,sans-serif}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.meter span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),#ff8a3d);transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.meter.full span{background:linear-gradient(90deg,#1f9d55,#7bd88f)}
@keyframes inn{from{opacity:0;transform:translateY(-8px)}}
@keyframes flash{0%,40%{background:var(--note)}100%{background:transparent}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes out{to{opacity:0;transform:translateX(40px)}}
@keyframes back{to{opacity:0;transform:translateX(-40px)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.it.new{animation:inn .25s ease-out,flash 2.2s ease-out}
.it.out{animation:out .22s ease-in forwards}.it.back{animation:back .22s ease-in forwards}
.done .ck span{animation:pop .3s ease-out}
.scrim{animation:fade .2s}.sheet{animation:up .25s cubic-bezier(.2,.9,.3,1)}
.party{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.party i{position:absolute;top:0;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
.yay{background:var(--note);border:1px solid var(--noteb);border-radius:14px;padding:14px 16px;margin-top:16px;font:800 20px Archivo,sans-serif;animation:inn .3s ease-out}
h2{font:600 13px/1 Inter,sans-serif;color:var(--mute);margin:22px 0 8px;display:flex;justify-content:space-between}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.it{display:flex;align-items:center;border-top:1px solid var(--line);min-height:56px}
.it:first-child{border-top:0}
.ck{flex:none;width:56px;height:56px;border:0;background:none;display:grid;place-items:center}
.ck span{width:26px;height:26px;border:2px solid var(--mute);border-radius:50%;display:grid;place-items:center}
.done .ck span{background:var(--acc);border-color:var(--acc)}
.ck svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.done .ck svg{opacity:1}
.nm{flex:1;border:0;background:none;text-align:left;padding:8px 12px 8px 0;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.nm .t{font-weight:500;font-size:16px}
.nm .m{font-size:13px;color:var(--mute)}
.done .t{text-decoration:line-through;color:var(--mute)}
.q{flex:none;font:800 15px Archivo,sans-serif;background:var(--note);border:1px solid var(--noteb);border-radius:8px;padding:2px 8px;margin-right:12px}
.tag{flex:none;font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;margin-right:10px}
.tag.M{background:var(--mb);color:var(--mi)}.tag.L{background:var(--lb);color:var(--li)}
.fx{color:var(--acc);font-weight:600}
.empty{background:var(--note);border:1px dashed var(--noteb);border-radius:14px;padding:22px;margin-top:18px}
.empty h3{font:800 22px/1.1 Archivo,sans-serif;margin:0 0 6px}
.empty p{margin:0 0 14px;color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-weight:600;font-size:15px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dan{color:var(--acc)}
.add{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
.add form{display:flex;gap:8px}
.add input{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
.add .btn{min-height:48px}
.sug{position:absolute;left:0;right:0;bottom:100%;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.12);max-height:50vh;overflow:auto}
.sug button{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border:0;border-bottom:1px solid var(--line);background:none;padding:0 16px;text-align:left}
.sug button small{color:var(--mute);margin-left:auto;font-size:12px}
.sug .new{color:var(--acc);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font:800 24px/1.1 Archivo,sans-serif;margin:0 0 14px}
.sheet label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
.sheet input[type=text],.sheet select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:16px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:600}
.step output{font:800 24px Archivo,sans-serif;min-width:40px;text-align:center}
.tgl{display:flex;align-items:center;gap:12px;margin-top:16px;min-height:48px;font-weight:500}
.tgl input{width:24px;height:24px;accent-color:var(--acc)}
.cat h4{font:600 14px Inter,sans-serif;margin:18px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{min-height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:14px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
.note{font-size:13px;color:var(--mute);margin-top:22px}
.add .btn{padding:0 12px}
.ing{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line);padding:4px 14px;cursor:pointer}
.ing:first-child{border-top:0}
.ing input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.ing .t{flex:1}.ing small{color:var(--mute);font-size:13px;display:block}
.ing .tg{font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px;background:var(--line);color:var(--mute);flex:none}
.row2{display:flex;gap:8px;margin-top:10px}.row2 input{flex:1}
.think{display:flex;align-items:center;gap:10px;color:var(--mute);margin:16px 0}
.think i{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{display:flex;align-items:center;gap:14px}
.hb{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff;border-radius:10px;min-height:40px;padding:0 12px;font-weight:600;font-size:14px}
body.setup .add,body.setup nav{display:none}
.setup-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:20px}
.setup-card h3{font:800 24px/1.1 Archivo,sans-serif;margin:0 0 8px}
.setup-card input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;margin:6px 0 12px}
.setup-card label{font-size:13px;color:var(--mute)}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:18px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.inst{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px}
.inst .btn{background:var(--acc);border-color:var(--acc);color:#fff;min-height:40px}
.mcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;margin-top:14px;border:1px solid var(--noteb);background:var(--note);border-radius:14px;padding:14px 16px;text-align:left}
.mcard strong{font:800 19px Archivo,sans-serif}.mcard span{font-size:14px;color:var(--mute)}
.day{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}.day strong{width:100%;font-size:14px}
.day .pill{flex:1 1 140px;text-align:left}.day .pill.on{background:var(--note);color:var(--ink);border-color:var(--noteb)}
#micb[hidden]{display:none}#micb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.toast .undo{border:0;background:none;color:var(--acc);font-weight:700;min-height:36px;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Super Gabi</h1><div style="display:flex;align-items:center;gap:10px"><div class="st" id="st"><i></i><span>Conectando…</span></div><button class="hb" id="setb" aria-label="Ajustes">Ajustes</button></div></div></header>
<nav><div class="chips" id="chips" role="tablist" aria-label="Listas"></div></nav>
<main class="wrap" id="main"></main>
<div class="add"><div class="wrap" style="position:relative">
  <div class="sug" id="sug" hidden></div>
  <form id="addf" autocomplete="off">
    <input id="addi" type="text" placeholder="Leche, 2 tomates y pan…" aria-label="Agregar producto" enterkeyhint="done">
    <button class="btn" type="button" id="micb" hidden aria-label="Dictar productos">Voz</button>
    <button class="btn" type="button" id="catb">Catálogo</button>
    <button class="btn" type="button" id="mealb">Comidas</button>
  </form>
</div></div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>
<script>
{

const CATS=CAT.map(c=>c[0]);
// Recetas base (para 4). '*' = básico de despensa: viene desmarcado.
const RECIPES={

'Lentejas':'Lentejas cocidas|2 botes;Chorizo|1;Patatas|2;Zanahorias|2;Cebollas|1;Pimiento verde|1;Pimentón|*;Ajos|*;Aceite de oliva virgen extra|*;Sal|*',

'Poke bowl':'Arroz|300 g;Salmón fresco|400 g;Aguacates|2;Edamame|1 bolsa;Pepino|1;Mango|1;Salsa de soja|*;Cebolla morada|1',
'Curry de pollo':'Pechuga de pollo|600 g;Leche de coco|1 lata;Curry en polvo|*;Cebollas|1;Ajos|*;Jengibre|1 trozo;Tomate triturado|1 lata;Arroz basmati|300 g;Sal|*',

const SB='https://clnodhylcaigjtkmwmnl.supabase.co/rest/v1/docs';
const SBK='sb_publishable_Dy9kfg1ULet8h9yVjezaAg_xPdjRdEf';

let OUT=[];try{OUT=JSON.parse(getPref('sg.out')||'[]')||[]}catch(e){OUT=[]}
function saveOut(){setPref('sg.out',JSON.stringify(OUT))}
function cacheSave(){const o={};COLS.forEach(c=>{o[c]=S[c]});setPref('sg.cache',JSON.stringify({h:HH,data:o,since:S.since}))}

function queueOp(col,id,del){
  OUT=OUT.filter(o=>!(o.col===col&&o.id===id));
  OUT.push({col,id,del:!!del,data:del?null:JSON.parse(JSON.stringify(S[col][id]||{}))});
  saveOut();cacheSave();render();flush();
}
const api={
  put(col,id,data){S[col][id]=JSON.parse(JSON.stringify(data));queueOp(col,id);return Promise.resolve()},
  patch(col,id,data){if(!S[col][id])S[col][id]={};deepMerge(S[col][id],JSON.parse(JSON.stringify(data)));queueOp(col,id);return Promise.resolve()},
  del(col,id){delete S[col][id];queueOp(col,id,true);return Promise.resolve()}
};
function setStatus(){
  if(!HH){status('off','Sin casa');return}
  if(!S.online)status('off',OUT.length?'Sin señal · se guarda al volver':'Sin señal');
  else if(OUT.length)status('','Guardando…');
  else status('ok','Sincronizado');
}
let flushing=false;
async function flush(){
  if(flushing||!HH||!OUT.length)return;flushing=true;
  try{
    while(OUT.length){
      const o=OUT[0];
      const body={household:HH,col:o.col,id:o.id,data:o.del?{}:o.data,deleted:o.del};
      const r=await fetch(SB+'?on_conflict=household,col,id',{method:'POST',headers:hdr({'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(body)});
      if(!r.ok){
        if(r.status>=400&&r.status<500&&r.status!==408&&r.status!==429){OUT=OUT.filter(x=>x!==o);saveOut();toast('No se pudo guardar un cambio');continue}
        throw new Error('net');
      }
      OUT=OUT.filter(x=>x!==o);saveOut();S.online=true;
    }
  }catch(e){S.online=false}
  finally{flushing=false;setStatus()}
}
let pulling=false;
async function pull(){
  if(pulling||!HH)return;pulling=true;
  try{
    let more=true,changed=false;
    while(more){
      const since=S.since?new Date(S.since-5000).toISOString():null;
      const url=SB+'?select=col,id,data,deleted,updated_at&order=updated_at.asc&limit=1000'+(since?'&updated_at=gt.'+encodeURIComponent(since):'');
      const r=await fetch(url,{headers:hdr()});
      if(!r.ok)throw new Error('http '+r.status);
      const rows=await r.json();
      const pend=new Set(OUT.map(o=>o.col+'/'+o.id));
      let maxT=S.since;
      for(const row of rows){
        const t=Date.parse(row.updated_at)||0;if(t>maxT)maxT=t;
        if(!S[row.col]||pend.has(row.col+'/'+row.id))continue;
        if(row.deleted){if(S[row.col][row.id]){delete S[row.col][row.id];changed=true}}
        else if(JSON.stringify(S[row.col][row.id])!==JSON.stringify(row.data)){S[row.col][row.id]=row.data;changed=true}
      }
      more=rows.length===1000&&maxT>S.since;S.since=maxT;
    }
    S.online=true;S.synced=true;
    if(S.mode==='loading'){S.mode='db';changed=true}
    cacheSave();if(changed)render();
  }catch(e){S.online=false;if(S.mode==='loading'){S.mode='db';render()}}
  finally{pulling=false;setStatus()}
}

async function addItem(name,cat,opts={}){

// ---- varios productos de una vez (escrito o dictado) ----
const NUMS={un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,doce:12,'media docena':6};
function parsePart(s){
  let t=s.trim().replace(/[.;]+$/,'');let q=1;
  let m=t.match(/^(\d{1,2})\s*(x\s*)?(.+)$/i);
  if(m){q=+m[1];t=m[3]}
  else{const w=norm(t).split(/\s+/);const two=w.slice(0,2).join(' ');
    if(NUMS[two]){q=NUMS[two];t=t.split(/\s+/).slice(2).join(' ')}
    else if(NUMS[w[0]]){q=NUMS[w[0]];t=t.split(/\s+/).slice(1).join(' ')}}
  t=t.replace(/^(de|docenas? de|paquetes? de|botes? de|latas? de|kilos? de|kg de|litros? de|bolsas? de)\s+/i,'').trim();
  return {name:t,qty:Math.max(1,Math.min(99,q))};
}
function match(name){
  const L=curList();const q=norm(name);if(!q)return null;
  const pool=L?catalog().filter(p=>fits(p,L.store||'A')):catalog();
  const sing=q.replace(/(es|s)$/,'');
  return pool.find(p=>norm(p.name)===q)||pool.find(p=>norm(p.name).startsWith(q+' '))||pool.find(p=>norm(p.name).replace(/(es|s)$/,'')===sing)||pool.find(p=>norm(p.name).startsWith(sing))||null;
}
function addMany(text){
  const parts=text.split(/,|\n|\s+y\s+|\s+e\s+/i).map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1){const pp=parsePart(text);const hit=match(pp.name);addItem(hit?hit.name:pp.name,undefined,{qty:pp.qty});return}
  const names=[];
  parts.forEach(s=>{const pp=parsePart(s);if(!pp.name)return;const hit=match(pp.name);const n=hit?hit.name:pp.name.charAt(0).toUpperCase()+pp.name.slice(1);addItem(n,hit?undefined:'Otros',{qty:pp.qty,quick:true,quiet:true});names.push(n+(pp.qty>1?' ×'+pp.qty:''))});
  toast('Agregados: '+names.join(', '));
}

function parseJSON(t){
  t=String(t||'').trim();
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw {code:'invalid_json'};
}
const GEM_PROXY='https://clnodhylcaigjtkmwmnl.supabase.co/functions/v1/gemini';
async function gemini(prompt,signal){
  const key=(getPref('sg.gemkey')||'').trim();
  if(!key){
    // IA de la casa: la clave vive en el servidor, nunca en el teléfono
    let r;
    try{r=await fetch(GEM_PROXY,{method:'POST',signal,headers:{'Content-Type':'application/json','apikey':SBK,'x-household':HH},body:JSON.stringify({prompt})})}
    catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'offline'}}
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok){throw {code:j.code==='no_casa'?'no_casa':(j.code||'upstream_error')}}
    return parseJSON(j.text);
  }
  let last={code:'upstream_error'};
  for(const m of GEM_MODELS){
    let r;
    try{
      r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},
        body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0.4}})});
    }catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};last={code:'offline'};continue}
    if(r.status===429){last={code:'rate_limited'};continue}
    if(r.status===404||r.status>=500){last={code:'upstream_error'};continue}
    if(r.status===400||r.status===401||r.status===403){
      let msg='';try{msg=JSON.stringify(await r.json())}catch(e){}
      if(/API key|API_KEY|PERMISSION_DENIED|unregistered/i.test(msg))throw {code:'bad_key'};
      last={code:'upstream_error'};continue;
    }
    if(!r.ok){last={code:'upstream_error'};continue}
    const j=await r.json();
    const t=(((j.candidates||[])[0]||{}).content||{}).parts;
    return parseJSON((t||[]).map(x=>x.text||'').join(''));
  }
  throw last;
}

async function buildMenu(){

      }catch(e){if(e&&e.code==='cancelled'){const w2=$('menuw');if(w2)w2.innerHTML='';return}}

  if(a==='store'){const L=curList();if(L&&L.store!==b.dataset.s)api.patch('lists',L.id,{store:b.dataset.s});return}
  if(a==='week'){openWeek();return}
  const li=b.closest('.it');
  if(a==='tog'&&li){
    const id=li.dataset.id;const i=S.items[id];if(!i||li.classList.contains('out')||li.classList.contains('back'))return;
    const prev=!!i.done;vib(15);
    if(!REDUCE)li.classList.add(prev?'back':'out');
    const LL=S.lists[i.list]||{};
    setTimeout(()=>api.patch('items',id,prev?{done:false,wait:false}:{done:true,wait:false,bw:LL.week||0}),REDUCE?0:200);
    if(!prev)toast('En el carro: '+i.name,()=>api.patch('items',id,{done:false}));
    return;
  }
  if(a==='newprod'){openNewProd('');return}
  if(a==='finish'){openFinish();return}
  if(a==='walink'){setTimeout(closeSheet,300);return}
  if(a==='alert'){
    const L=curList();let names=[];try{names=JSON.parse($('modal').dataset.names||'[]')}catch(err){}
    closeSheet();if(!L||!names.length)return;
    api.put('alerts',nid(),{list:L.id,names:names.slice(0,40),who:ME()||'',dev:S.dev,ts:Date.now()});
    toast('Aviso enviado: lo ve al abrir Super Gabi');return;
  }
  if(a==='alok'){S.cur=b.dataset.l;setPref(LSC,S.cur);api.del('alerts',b.dataset.id);render();toast('¡Gracias! Ya está en tu lista');return}
  if(a==='alno'){api.del('alerts',b.dataset.id);return}
  if(a==='mopen'){const m=S.meals[b.dataset.id];if(!m)return;MEAL={id:b.dataset.id,name:m.name,src:'guardada',ings:(m.ings||[]).map(i=>mkIng(i.name,i.qty,i.cat,i.basic))};drawMeal();return}
  if(a==='mrec'){MEAL={id:null,name:b.dataset.n,src:'receta',ings:fromRecipe(b.dataset.n)};drawMeal();return}
  if(a==='mai'){if(MEAL)runAI(MEAL.name);return}
  if(a==='mstop'){if(aiCtl)aiCtl.abort();if(menuCtl)menuCtl.abort();return}
  if(a==='menu'){openMenu();return}
  if(a==='order'){const L=curList();openOrder((L&&L.store)||'A');return}
  if(a==='ost'){openOrder(b.dataset.s);return}
  if(a==='oup'){moveOrd(+b.dataset.k,-1);return}
  if(a==='odn'){moveOrd(+b.dataset.k,1);return}
  if(a==='oreset'){ORD=[...CATS];openOrder();return}
  if(a==='osave'){
    const val={[ORDS]:ORD.slice()};
    if(S.config.orden)api.patch('config','orden',val);else api.put('config','orden',val);
    closeSheet();toast('Orden de '+STORES[ORDS]+' guardado');return;
  }
  if(a==='slot'){openSlot(+b.dataset.d,b.dataset.s);return}
  if(a==='sset'){setSlot(b.dataset.n);return}
  if(a==='mbuild'){b.disabled=true;buildMenu();return}
  if(a==='mclear'){
    if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tocá otra vez para vaciar';return}
    await api.put('menu','semana',{d:{}});openMenu();return;
  }
  if(a==='mgo'){mealToList();return}
  if(a==='mdel'){
    if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tocá otra vez para borrar';return}
    if(MEAL&&MEAL.id)api.del('meals',MEAL.id);closeSheet();toast('Comida borrada');return;
  }
  if(a==='saveprod'){
    const name=$('pn').value.trim().slice(0,80);if(!name){$('pn').focus();return}
    const cat=$('pc').value;const s=(document.querySelector('#psg [aria-pressed=true]')||{}).dataset;
    const ev=+$('pf').value||0;
    closeSheet();addItem(name,cat,{store:(s&&s.s)||'A',every:ev});return;
  }
  if(a==='copy'){
    const L=curList();if(!L)return;
    try{await navigator.clipboard.writeText(listText(L));toast('Lista copiada: pegala en WhatsApp')}catch(err){toast('No se pudo copiar en este navegador')}
    return;
  }
  if(a==='edit'&&li){openItem(li.dataset.id);return}
  if(a==='sug'){addItem(b.dataset.n);$('addi').value='';showSug();$('addi').focus();return}
  if(a==='cadd'){
    if(b.classList.contains('on')){toast('Ya está en la lista');return}
    b.classList.add('on');addItem(b.dataset.n);return;
  }
  if(a==='qm'||a==='qp'){const o=$('eq');o.textContent=Math.max(1,Math.min(99,(+o.textContent||1)+(a==='qp'?1:-1)));return}
  if(a==='saveitem'){
    const id=b.dataset.id;const i=S.items[id];if(!i){closeSheet();return}
    const d={name:($('en').value.trim()||i.name).slice(0,80),qty:+$('eq').textContent||1,cat:$('ec').value,note:$('eo').value.trim().slice(0,80),fixed:+$('ef').value>0,every:+$('ef').value||0};
    if(!d.fixed&&i.wait)d.wait=false;
    const ch={};Object.keys(d).forEach(k=>{if(d[k]!==i[k])ch[k]=d[k]});
    if(Object.keys(ch).length)api.patch('items',id,ch);
    closeSheet();return;
  }
  if(a==='delitem'){
    const id=b.dataset.id;const keep=S.items[id]?{...S.items[id]}:null;
    api.del('items',id);closeSheet();
    if(keep)toast('Quitado: '+keep.name,()=>api.put('items',id,keep));
    return;
  }
  if(a==='lst'){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
  if(a==='savelist'){
    const name=$('ln').value.trim().slice(0,40)||'Compra semanal';
    const st=(document.querySelector('#lsg [aria-pressed=true]')||{}).dataset;const store=(st&&st.s)||'A';
    const id=b.dataset.id;
    if(id){const l=S.lists[id];const ch={};if(l.name!==name)ch.name=name;if(l.store!==store)ch.store=store;if(Object.keys(ch).length)api.patch('lists',id,ch)}
    else{const nidv=nid();S.cur=nidv;setPref(LSC,nidv);api.put('lists',nidv,{name,store,order:lists().length,ts:Date.now()})}
    closeSheet();return;
  }
  if(a==='dellist'){
    if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tocá otra vez para borrar todo';return}
    const id=b.dataset.id;closeSheet();
    const its=itemsOf(id);
    await api.del('lists',id);
    for(const i of its)await api.del('items',i.id);
    S.cur=null;render();toast('Lista borrada');return;
  }
  if(a==='doweek'){
    const L=curList();closeSheet();if(!L)return;
    const all=itemsOf(L.id);const nw=(L.week||0)+1;
    await api.patch('lists',L.id,{week:nw});
    for(const i of all){
      if(i.done&&i.fixed){
        if(nw-(i.bw||0)>=every(i))await api.patch('items',i.id,{done:false,wait:false});
        else if(!i.wait)await api.patch('items',i.id,{wait:true});
      }
      else if(i.done)await api.del('items',i.id);
    }
    toast('Semana nueva lista');return;
  }
});
$('addf').addEventListener('submit',e=>{
  e.preventDefault();
  const v=$('addi').value.trim();if(!v)return;
  addMany(v);$('addi').value='';showSug();
});
$('addi').addEventListener('input',showSug);
$('sug').addEventListener('pointerdown',e=>e.preventDefault());
$('addi').addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==$('addi')){$('sug').hidden=true}},200));
$('catb').addEventListener('click',openCatalog);
$('mealb').addEventListener('click',openMeals);
$('modal').addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='mf'){
    const q=$('mq').value.trim();if(!q)return;
    const f=findMeal(q);
    if(f){MEAL=f;drawMeal()}
    else{MEAL={id:null,name:q.charAt(0).toUpperCase()+q.slice(1),src:'ia',ings:[]};drawMeal();runAI(q)}
  }
  if(e.target.id==='sf'){setSlot($('sq').value);return}
  if(e.target.id==='mif'&&MEAL){
    const v=$('mi').value.trim();if(!v)return;
    const g=mkIng(v,'','',false);const ex=MEAL.ings.find(i=>norm(i.name)===norm(g.name));
    if(ex)ex.on=true;else MEAL.ings.push(g);drawMeal();
    const f=$('mi');if(f)f.focus();
  }
});
$('modal').addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.mi;if(k===undefined||!MEAL)return;
  MEAL.ings[+k].on=e.target.checked;
  const n=MEAL.ings.filter(i=>i.on).length;const b=document.querySelector('[data-act=mgo]');
  if(b){b.textContent=`Agregar ${n} a la lista`;b.disabled=!n}
});
$('modal').addEventListener('input',e=>{
  if(e.target.id!=='cq')return;
  const q=norm(e.target.value);
  document.querySelectorAll('#cl .cat').forEach(c=>{
    let any=false;
    c.querySelectorAll('.pill').forEach(p=>{const ok=!q||p.dataset.k.includes(q);p.hidden=!ok;if(ok)any=true});
    c.hidden=!any;
  });
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

// ---- arranque, casa, ajustes, instalación y voz ----
function newSecret(){const b=new Uint8Array(30);crypto.getRandomValues(b);return btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function inviteLink(){return location.origin+location.pathname+'#casa='+HH}
function codeFrom(s){s=String(s||'').trim();const m=s.match(/casa=([A-Za-z0-9_-]{32,80})/);if(m)return m[1];return /^[A-Za-z0-9_-]{32,80}$/.test(s)?s:''}
function enterHouse(code){
  HH=code;setPref('sg.casa',code);
  COLS.forEach(c=>{S[c]={}});S.since=0;S.cur=null;OUT=[];saveOut();
  document.body.classList.remove('setup');S.mode='loading';render();pull().then(()=>{if(!lists().length&&S.online)toast('Casa lista. Creá tu primera lista.')});
}
function renderSetup(){
  document.body.classList.add('setup');
  $('chips').innerHTML='';
  $('main').innerHTML=`<div class="setup-card"><h3>Bienvenido a Super Gabi</h3>
  <p>La lista del súper compartida de tu casa. Sin cuentas ni contraseñas: se comparte con un link.</p>
  <label for="nm">Tu nombre</label><input type="text" id="nm" maxlength="20" placeholder="Ej.: Franco" value="${esc(ME())}">
  <button class="btn pri" data-act="mkhouse" style="width:100%">Crear mi casa</button>
  <div class="or">o</div>
  <label for="jc">¿Te pasaron un link de Super Gabi? Pegalo acá (o abrilo directamente)</label>
  <input type="text" id="jc" placeholder="https://…#casa=…">
  <button class="btn" data-act="joinhouse" style="width:100%">Unirme a esa casa</button></div>`;
  status('off','Sin casa');
}
function openSettings(){
  const k=getPref('sg.gemkey')||'';
  sheet(`<h3>Ajustes</h3>
  <label for="snm">Tu nombre (aparece en lo que agregás)</label><input type="text" id="snm" data-nofocus="1" maxlength="20" value="${esc(ME())}">
  ${HH?`<label>Invitar a alguien a tu casa</label><p class="note" style="margin-top:0">Quien abra este link entra a tus listas. Mandalo sólo a la gente de tu casa.</p>
  <div class="acts" style="margin-top:6px"><button class="btn pri" type="button" data-act="cplink">Copiar link</button><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Te invito a nuestra lista del súper en Super Gabi: '+inviteLink())}">Mandar por WhatsApp</a></div>`:''}
  <label for="sgk">IA para comidas: ya viene incluida. Clave propia de Gemini (opcional)</label><input type="text" id="sgk" data-nofocus="1" value="${esc(k)}" placeholder="Pegá tu clave gratis" autocomplete="off" spellcheck="false">
  <p class="note" style="margin-top:0">Dejalo vacío para usar la IA de la casa. Sólo si querés usar otra clave: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</p>
  ${deferredInstall?'<div class="acts"><button class="btn" data-act="install">Instalar la app</button></div>':''}
  <div class="acts"><button class="btn pri" data-act="savesettings">Guardar</button>${HH?'<button class="btn dan" data-act="leave">Salir de esta casa</button>':''}<button class="btn" data-act="close">Cerrar</button></div>`);
}
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(S.mode==='db')render()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('¡Super Gabi instalada!');render()});
function installCard(){return deferredInstall?'<div class="inst"><span>Instalá Super Gabi como app</span><button class="btn" data-act="install">Instalar</button></div>':''}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='mkhouse'){const n=$('nm').value.trim();if(!n){$('nm').focus();toast('Poné tu nombre');return}setPref('sg.name',n.slice(0,20));enterHouse(newSecret());return}
  if(a==='joinhouse'){const n=$('nm').value.trim();if(!n){$('nm').focus();toast('Poné tu nombre');return}const c=codeFrom($('jc').value);if(!c){toast('Ese link no es de Super Gabi');return}setPref('sg.name',n.slice(0,20));enterHouse(c);return}
  if(a==='cplink'){try{await navigator.clipboard.writeText(inviteLink());toast('Link copiado')}catch(err){toast('No se pudo copiar')}return}
  if(a==='savesettings'){const n=$('snm').value.trim();if(n)setPref('sg.name',n.slice(0,20));setPref('sg.gemkey',$('sgk').value.trim());closeSheet();toast('Guardado');render();return}
  if(a==='leave'){
    if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tocá otra vez: necesitás el link para volver';return}
    closeSheet();HH='';setPref('sg.casa','');setPref('sg.cache','');OUT=[];saveOut();COLS.forEach(c=>{S[c]={}});S.mode='setup';renderSetup();return;
  }
  if(a==='install'){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(err){}deferredInstall=null;closeSheet();render();return}
});
$('setb').addEventListener('click',openSettings);
function setupMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  const b=$('micb');b.hidden=false;let rec=null;
  b.addEventListener('click',()=>{
    if(rec){rec.stop();return}
    rec=new SR();rec.lang='es-ES';rec.interimResults=true;rec.continuous=false;
    rec.onresult=ev=>{let t='';for(const r of ev.results)t+=r[0].transcript;$('addi').value=t.trim()};
    rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')toast('Permití el micrófono para usar la voz')};
    rec.onend=()=>{rec=null;b.classList.remove('on');b.textContent='Voz';const v=$('addi').value.trim();if(v){addMany(v);$('addi').value='';showSug()}};
    try{rec.start();b.classList.add('on');b.textContent='Parar'}catch(err){rec=null}
  });
}
function init(){
  const fromHash=codeFrom(location.hash);
  if(fromHash){
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(fromHash!==HH){
      if(!ME()){HH='';renderSetup();const jc=$('jc');if(jc)jc.value='#casa='+fromHash;toast('Poné tu nombre y tocá "Unirme"');setupMic();startSync();return}
      enterHouse(fromHash);setupMic();startSync();return;
    }
  }
  setupMic();
  if(!HH){S.mode='setup';renderSetup();startSync();return}
  if(cacheLoad())S.mode='db';
  render();startSync();
}
function startSync(){
  if(startSync.on)return;startSync.on=true;
  pull();flush();
  setInterval(()=>{if(!document.hidden){pull();flush()}},4000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull();flush()}});
  window.addEventListener('online',()=>{flush();pull()});
  window.addEventListener('offline',()=>{S.online=false;setStatus()});
}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
}
</script>
