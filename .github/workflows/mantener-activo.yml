# Mantiene despierta la base de Supabase (el plan gratis la pausa tras 7 días sin uso).
# Consulta la base cada 2 días. El día 1 de cada mes además deja un commit,
# porque GitHub apaga las tareas programadas de repos sin actividad en 60 días.
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 6 */2 * *"
    - cron: "23 5 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        run: |
          curl -fsS -o /dev/null -w "Supabase respondió %{http_code}\n" \
            "https://clnodhylcaigjtkmwmnl.supabase.co/rest/v1/docs?select=id&limit=1" \
            -H "apikey: sb_publishable_Dy9kfg1ULet8h9yVjezaAg_xPdjRdEf" \
            -H "x-household: mantener_activo_000000000000000000000000"
      - uses: actions/checkout@v4
        if: github.event.schedule == '23 5 1 * *'
      - name: Commit mensual para que GitHub no apague la tarea
        if: github.event.schedule == '23 5 1 * *'
        run: |
          date -u +%Y-%m-%dT%H:%MZ > .mantener-activo
          git config user.name "super-gabi-bot"
          git config user.email "super-gabi-bot@users.noreply.github.com"
          git add .mantener-activo
          git commit -m "Mantener activo" && git push
